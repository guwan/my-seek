spring:
  application:
    name: MySeek
  profiles:
    default: dev

  # Java 21+ 虚拟线程：显著提升 IO 密集型接口的并发能力
  threads:
    virtual:
      enabled: true

  # 懒加载关联已在 Service 层通过 @Transactional / @EntityGraph 收敛，
  # 不再开启 OSIV，避免 Session/数据库连接随整个请求（尤其 AI 流式接口）长期占用。
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  #jackson相关配置
  jackson:
    default-property-inclusion: ALWAYS
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cache:
    type: redis

  ai:
    # 显式指定各模型类型的提供方：
    # - chat/embedding 使用 ollama（本地），同时避免 OpenAI 的 EmbeddingModel 与之冲突
    # - 音频/图像/审核一律关闭：豆包与千问由 Doubao/QwenModelProvider 自行构造兼容客户端，
    #   不依赖 Spring AI 的 openai 自动装配（未配置 api-key 时自动装配会直接导致启动失败）
    model:
      chat: ollama
      embedding: ollama
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:deepseek-r1:8b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      init:
        # 启动时不自动拉取模型，避免本地缺少嵌入模型时长时间阻塞启动
        pull-model-strategy: ${OLLAMA_PULL_MODEL_STRATEGY:NEVER}
    # 向量存储配置（使用 Redis）
    vectorstore:
      redis:
        index-name: knowledge-base
        prefix: "doc:"
        # 开启后启动期会连接 Redis 并创建向量索引（需要 Redis Stack 的 RediSearch 模块）
        initialize-schema: ${VECTOR_STORE_INITIALIZE_SCHEMA:true}

# 豆包（字节跳动）配置
doubao:
  api-key: ${DOUBAO_API_KEY:}
  base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}

# 千问（阿里云）配置
qwen:
  api-key: ${QWEN_API_KEY:}
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

# 文件上传配置
file:
  upload:
    path: ${FILE_UPLOAD_PATH:uploads/documents/}
    max-size: 50MB

captcha:
  key: ${CAPTCHA_KEY:captcha_}
  timeout: ${CAPTCHA_TIMEOUT:60}

security:
  jwt:
    token:
      # 生产环境必须通过 JWT_SECRET_KEY 环境变量注入（至少 32 字符）
      secret-key: ${JWT_SECRET_KEY:}
      expire-length: 86400000 # 默认一天内有效: 24 hour*60 minutes * 60 seconds * 1000 miliseconds

mail:
  send:
    host: ${MAIL_HOST:}
    mail: ${MAIL_ACCOUNT:}
    token: ${MAIL_TOKEN:}
    register:
      host: ${REGISTER_HOST:http://localhost:8080}

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}"

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
