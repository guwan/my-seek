# 用户数据工作目录：所有生成内容默认写在这里，不写进源码目录。
# 本地默认 ${user.home}/MySeek；Docker 通过 MYSEEK_WORK_DIR=/app/work 覆盖。
app:
  work-dir: ${MYSEEK_WORK_DIR:${user.home}/MySeek}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}"

spring:
  application:
    name: MySeek
  profiles:
    default: dev

  # Java 21+ 虚拟线程：显著提升 IO 密集型接口的并发能力
  threads:
    virtual:
      enabled: true

  # 懒加载关联已在 Service 层通过 @Transactional / @EntityGraph 收敛，
  # 不再开启 OSIV，避免 Session/数据库连接随整个请求（尤其 AI 流式接口）长期占用。
  # 数据库迁移：已有库先 baseline，避免 V1 与历史表冲突
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        format_sql: false

  #jackson相关配置
  jackson:
    default-property-inclusion: ALWAYS
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cache:
    type: redis

  ai:
    # 显式指定各模型类型的提供方：
    # - chat/embedding 使用 ollama（本地），同时避免 OpenAI 的 EmbeddingModel 与之冲突
    # - 音频/图像/审核一律关闭：豆包与千问由 Doubao/QwenModelProvider 自行构造兼容客户端，
    #   不依赖 Spring AI 的 openai 自动装配（未配置 api-key 时自动装配会直接导致启动失败）
    model:
      chat: ollama
      embedding: ollama
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:deepseek-r1:8b}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
      init:
        # 启动时不自动拉取模型，避免本地缺少嵌入模型时长时间阻塞启动
        pull-model-strategy: ${OLLAMA_PULL_MODEL_STRATEGY:NEVER}
    # 向量存储配置（使用 Redis）
    vectorstore:
      redis:
        index-name: knowledge-base
        prefix: "doc:"
        # 开启后启动期会连接 Redis 并创建向量索引（需要 Redis Stack 的 RediSearch 模块）
        initialize-schema: ${VECTOR_STORE_INITIALIZE_SCHEMA:true}
        # MCP 客户端：AI 任务中心可调用外部 MCP 服务器工具。默认关闭；
        # 需要时通过环境变量 MCP_ENABLED=true 并在配置中声明 sse/stdio 连接。
        # 示例（SSE）：
        #   sse:
        #     connections:
        #       weather:
        #         url: http://localhost:3001/sse
        mcp:
        client:
          enabled: ${MCP_ENABLED:false}
          type: SYNC
          toolcallback:
            enabled: ${MCP_TOOLCALLBACK_ENABLED:true}


# 豆包（字节跳动）配置
doubao:
  api-key: ${DOUBAO_API_KEY:}
  base-url: ${DOUBAO_BASE_URL:https://ark.cn-beijing.volces.com/api/v3}

# 千问（阿里云）配置
qwen:
  api-key: ${QWEN_API_KEY:}
  base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}

# 第三方 AI 接口：用于加密保存用户填写的 API Key（生产环境务必用环境变量覆盖）
ai-provider:
  secret: ${AI_PROVIDER_SECRET:myseek-local-dev-secret-change-me}

# 联网搜索配置（对话页可按需开启）
web-search:
  # provider: tavily（需 Key，质量高）或 wikipedia（免 Key 兜底）
  provider: ${WEB_SEARCH_PROVIDER:tavily}
  max-results: ${WEB_SEARCH_MAX_RESULTS:5}
  tavily:
    # 从 https://tavily.com 免费申请；为空时自动降级到 wikipedia
    api-key: ${TAVILY_API_KEY:}
    base-url: ${TAVILY_BASE_URL:https://api.tavily.com}

# 文件上传配置：默认落在工作目录，可用 FILE_UPLOAD_PATH 单独覆盖
file:
  upload:
    path: ${FILE_UPLOAD_PATH:${app.work-dir}/uploads/documents}
    max-size: 50MB

# 小说生成文件目录：默认落在工作目录，可用 NOVEL_STORAGE_PATH 单独覆盖
novel:
  storage:
    path: ${NOVEL_STORAGE_PATH:${app.work-dir}/novels}

captcha:
  key: ${CAPTCHA_KEY:captcha_}
  timeout: ${CAPTCHA_TIMEOUT:60}

security:
  jwt:
    token:
      # 生产环境必须通过 JWT_SECRET_KEY 环境变量注入（至少 32 字符）
      secret-key: ${JWT_SECRET_KEY:}
      expire-length: 86400000 # 默认一天内有效: 24 hour*60 minutes * 60 seconds * 1000 miliseconds

mail:
  send:
    host: ${MAIL_HOST:}
    mail: ${MAIL_ACCOUNT:}
    token: ${MAIL_TOKEN:}
    register:
      host: ${REGISTER_HOST:http://localhost:8080}

# RAG 检索：相似度阈值过滤无关片段，topK 与 prompt 预算防止上下文超限
rag:
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.35}
  max-top-k: ${RAG_MAX_TOP_K:20}
  prompt-max-chars: ${RAG_PROMPT_MAX_CHARS:8000}

# 内嵌 Luban-RDS 默认关闭，仅在 demo profile（或显式设置 LUBAN_RDS_ENABLED=true）时启用，
# 避免普通开发/生产模式在项目目录生成 data/dump.rdb
luban:
  rds:
    enabled: ${LUBAN_RDS_ENABLED:false}

# 流式对话停滞超时：距离上一个数据帧超过该时长仍未结束则按已生成内容收尾。
# 默认 5 分钟，慢模型正常输出不会误触发；可按部署环境用环境变量覆盖。
chat:
  stream:
    stall-timeout-seconds: ${CHAT_STREAM_STALL_TIMEOUT:300}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis

logging:
  pattern:
    # RequestIdFilter 将 requestId 写入 MDC；日志中统一打印，便于按请求检索。
    level: "%5p [${spring.application.name:MySeek},%X{requestId:-}]"
