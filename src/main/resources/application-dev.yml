spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/seek?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: a1111a
    driver-class-name: org.mariadb.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      auto-commit: true
      minimum-idle: 2
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: dapHikari
      maximum-pool-size: 5
  jpa:
    database: mysql
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    generate-ddl: true
    database-platform: org.hibernate.dialect.MariaDBDialect
    hibernate:
      ddl-auto: update
      dialect: org.hibernate.dialect.MariaDBDialect

  data:
    redis:
      database: 5
      password: '!@#Pwdadc2'
      #host: 192.168.0.73
      host: localhost
      port: 6379
      # 连接超时时间（毫秒） 去链接redis服务端
      timeout: 6000
      lettuce:
        pool:
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制） 表示连接池的链接拿完了 现在去申请需要等待的时间
          max-wait: -1
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0

